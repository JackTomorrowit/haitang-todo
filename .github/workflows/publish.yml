name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Publish haitang-todo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          WHO=$(npm whoami 2>&1); WHO_CODE=$?
          VIEW=$(npm view "$PKG@$VER" version 2>&1); VIEW_CODE=$?
          PUB=""
          PUB_CODE=none
          if [ "$VIEW_CODE" -eq 0 ]; then
            PUB="skipped: version exists"
            PUB_CODE=0
          else
            PUB=$(npm publish --access public 2>&1); PUB_CODE=$?
          fi
          {
            echo "time: $(date -u +%FT%TZ)"
            echo "package: $PKG"
            echo "version: $VER"
            echo "whoami($WHO_CODE): $WHO"
            echo "view($VIEW_CODE): $VIEW"
            echo "publish($PUB_CODE): $PUB"
          } > npm-result.txt
          cat npm-result.txt
          git config user.name 'gh-actions'
          git config user.email 'gh-actions@users.noreply.github.com'
          git add npm-result.txt
          git commit -m "ci: record npm publish result" >/dev/null 2>&1
          git push origin HEAD:main >/dev/null 2>&1
          exit $PUB_CODE
